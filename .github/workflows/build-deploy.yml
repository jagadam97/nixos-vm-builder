name: Build and Deploy LXC Containers

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      containers: ${{ steps.discover.outputs.containers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover containers
        id: discover
        run: |
          # Find all container directories and format as JSON array
          CONTAINERS=$(ls -d containers/*/ 2>/dev/null | xargs -n1 basename | grep -v '^common$' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "containers=$CONTAINERS" >> $GITHUB_OUTPUT
          echo "Found containers: $CONTAINERS"

  build-and-deploy:
    needs: discover
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(needs.discover.outputs.containers) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: jagadam97
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build ${{ matrix.container }}-lxc
        run: |
          make ${{ matrix.container }}-lxc

      - name: Push to Cachix
        run: |
          nix path-info --all | grep -v '\.drv$' | cachix push jagadam97

      - name: Prepare release info
        if: github.event_name != 'pull_request'
        id: release
        run: |
          TARBALL=$(ls result/tarball/*.tar.xz)
          FILENAME=$(basename "${TARBALL}")
          SIZE=$(du -h "${TARBALL}" | cut -f1)

          # Extract version and container name from filename (<container>-v<version>.tar.xz)
          # Version can contain dots, underscores, and dashes (e.g., v10.11.6_7.1.2-2)
          VERSION=$(echo "$FILENAME" | sed -n 's/.*-\(v[0-9][^[:space:]]*\)\.tar\.xz/\1/p')
          CONTAINER=$(echo "$FILENAME" | sed -n 's/\(.*\)-v[0-9].*\.tar\.xz/\1/p')
          TAG="${CONTAINER}-${VERSION}"

          echo "path=${TARBALL}" >> $GITHUB_OUTPUT
          echo "name=${FILENAME}" >> $GITHUB_OUTPUT
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "container=${CONTAINER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          echo "Tarball: ${TARBALL} (${SIZE})"
          echo "Release tag: ${TAG}"

      - name: Delete existing release if present
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Delete ALL previous releases for this container
          CONTAINER="${{ steps.release.outputs.container }}"
          echo "Deleting all previous releases for ${CONTAINER}..."
          for old_release in $(gh release list --json tagName --jq '.[].tagName' | grep "^${CONTAINER}-v" || true); do
            echo "Deleting release: ${old_release}"
            gh release delete "${old_release}" --yes --cleanup-tag || true
          done

          # Delete any leftover tags with no attached release (orphans from
          # a previous run that pushed the tag but failed before creating
          # the release), otherwise `git tag` below fails with "already exists"
          for old_tag in $(git tag -l "${CONTAINER}-v*"); do
            echo "Deleting leftover tag: ${old_tag}"
            git push --delete origin "${old_tag}" 2>/dev/null || true
            git tag -d "${old_tag}" 2>/dev/null || true
          done

          # Create new tag at current commit and push
          TAG="${{ steps.release.outputs.tag }}"
          git tag ${TAG}
          git push origin ${TAG}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && success()
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"
          COMMIT_MESSAGE="${COMMIT_MESSAGE:-Manually triggered build}"

          # The tag was just pushed in the previous step; GitHub's API can
          # briefly lag behind that push and report the tag as not-yet-visible
          # ("exists locally but has not been pushed"). Retry instead of
          # failing on what's just a propagation delay.
          for attempt in 1 2 3 4 5; do
            if gh release create "${TAG}" \
              result/tarball/*.tar.xz \
              --title "${{ steps.release.outputs.container }} ${{ steps.release.outputs.version }}" \
              --notes "**Automated build from commit:** ${{ github.sha }}

          **Container:** ${{ matrix.container }}
          **Version:** ${{ steps.release.outputs.version }}
          **Size:** ${{ steps.release.outputs.size }}
          **Commit:** ${COMMIT_MESSAGE}

          ### Files
          - \`${{ steps.release.outputs.name }}\`"; then
              exit 0
            fi
            echo "gh release create failed (attempt ${attempt}/5) - tag may not have propagated yet, retrying in 5s..."
            sleep 5
          done

          echo "gh release create failed after 5 attempts"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create versioned release (tag push)
        if: startsWith(github.ref, 'refs/tags/') && steps.release.outcome == 'success'
        run: |
          CONTAINER="${{ steps.release.outputs.container }}"
          CURRENT_TAG="${{ github.ref_name }}"

          # Delete ALL previous releases for this container (except the one
          # just pushed, which triggered this run)
          echo "Deleting all previous releases for ${CONTAINER}..."
          for old_release in $(gh release list --json tagName --jq '.[].tagName' | grep "^${CONTAINER}-v" | grep -v "^${CURRENT_TAG}$" || true); do
            echo "Deleting release: ${old_release}"
            gh release delete "${old_release}" --yes --cleanup-tag || true
          done

          # Delete any leftover tags with no attached release
          for old_tag in $(git tag -l "${CONTAINER}-v*" | grep -v "^${CURRENT_TAG}$" || true); do
            echo "Deleting leftover tag: ${old_tag}"
            git push --delete origin "${old_tag}" 2>/dev/null || true
            git tag -d "${old_tag}" 2>/dev/null || true
          done

          gh release create "${CURRENT_TAG}" \
            result/tarball/*.tar.xz \
            --title "${{ steps.release.outputs.container }} ${{ steps.release.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Infra version upgrade
        run: |
         gh workflow run "Update Infrastructure Versions" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
