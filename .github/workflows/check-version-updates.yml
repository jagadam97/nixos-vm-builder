name: Check for Updates

on:
  workflow_run:
    workflows: ["Build and Deploy LXC Containers"]
    types:
      - completed
    branches: [ main ]
  schedule:
    - cron: '30 23 * * *'  # Run daily at 5 AM IST (23:30 UTC)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  # Stage 1: update the lock once and decide whether anything changed.
  # The updated flake.lock is passed to the build matrix as an artifact so
  # every container builds against the exact same lock.
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      containers: ${{ steps.discover.outputs.containers }}
      has_changes: ${{ steps.check.outputs.has_changes }}
      version_changes: ${{ steps.check.outputs.version_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: jagadam97
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Discover containers
        id: discover
        run: |
          # JSON array for the build matrix, space-separated list for the loops below
          CONTAINERS=$(ls -d containers/*/ 2>/dev/null | xargs -n1 basename | grep -v '^common$')
          echo "containers=$(echo "$CONTAINERS" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> $GITHUB_OUTPUT
          echo "list=$(echo "$CONTAINERS" | tr '\n' ' ')" >> $GITHUB_OUTPUT
          echo "Found containers: $CONTAINERS"

      - name: Check versions
        id: check
        run: |
          # Get current versions
          declare -A OLD_VERSIONS
          echo "Current versions:"
          for container in ${{ steps.discover.outputs.list }}; do
            VERSION=$(nix eval --raw ".#nixosConfigurations.${container}-lxc.config.environment.etc.\"build-info.txt\".text" 2>/dev/null | grep -oP '^Version: \K.*' | tail -1 || echo 'unknown')
            OLD_VERSIONS[$container]=$VERSION
            echo "  ${container}: ${VERSION}"
          done

          # Update flake.lock
          nix flake update

          # Get new versions
          declare -A NEW_VERSIONS
          echo ""
          echo "New versions:"
          for container in ${{ steps.discover.outputs.list }}; do
            VERSION=$(nix eval --raw ".#nixosConfigurations.${container}-lxc.config.environment.etc.\"build-info.txt\".text" 2>/dev/null | grep -oP '^Version: \K.*' | tail -1 || echo 'unknown')
            NEW_VERSIONS[$container]=$VERSION
            echo "  ${container}: ${VERSION}"
          done

          # Check for changes
          HAS_CHANGES=false
          VERSION_CHANGES=""

          for container in ${{ steps.discover.outputs.list }}; do
            OLD="${OLD_VERSIONS[$container]}"
            NEW="${NEW_VERSIONS[$container]}"

            if [ "$OLD" != "$NEW" ]; then
              HAS_CHANGES=true
              VERSION_CHANGES="${VERSION_CHANGES}- ${container}: ${OLD} -> ${NEW}\n"
              echo ""
              echo "Changed: ${container} ${OLD} -> ${NEW}"
            fi
          done

          echo ""
          echo "has_changes=${HAS_CHANGES}" >> $GITHUB_OUTPUT
          echo "version_changes<<EOF" >> $GITHUB_OUTPUT
          echo -e "$VERSION_CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload updated flake.lock
        if: steps.check.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock
          retention-days: 1

  # Stage 2: one runner per container, all in parallel.
  build:
    needs: check
    if: needs.check.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(needs.check.outputs.containers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use updated flake.lock
        uses: actions/download-artifact@v4
        with:
          name: flake-lock

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: jagadam97
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build ${{ matrix.container }}-lxc
        id: build
        run: |
          make "${{ matrix.container }}-lxc"

      - name: Cachix push everything
        run: |
          nix path-info --all | grep -v '\.drv$' | cachix push jagadam97

      - name: Record build result
        if: always()
        run: |
          mkdir -p build-status
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "✅ ${{ matrix.container }}-lxc: built successfully" > "build-status/${{ matrix.container }}.txt"
          else
            echo "❌ ${{ matrix.container }}-lxc: build failed" > "build-status/${{ matrix.container }}.txt"
          fi

      - name: Upload build result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-status-${{ matrix.container }}
          path: build-status/
          retention-days: 1

  # Stage 3: all builds are in - commit the lock, or open an issue.
  finalize:
    needs: [ check, build ]
    if: always() && needs.check.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build results
        uses: actions/download-artifact@v4
        with:
          pattern: build-status-*
          path: build-status
          merge-multiple: true

      - name: Aggregate build results
        id: results
        run: |
          echo "build_results<<EOF" >> $GITHUB_OUTPUT
          cat build-status/*.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          cat build-status/*.txt

      - name: Download updated flake.lock
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: flake-lock

      - name: Commit and push directly if builds pass
        if: needs.build.result == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # VERSION_CHANGES/BUILD_RESULTS come in via `env:` and are written to
          # a file rather than interpolated with `${{ }}` into a quoted -m
          # argument, where backticks in the text would run as shell.
          {
            echo "Update flake.lock - new container versions"
            echo ""
            echo "## Version Changes"
            echo "${VERSION_CHANGES}"
            echo "## Build Results"
            echo "${BUILD_RESULTS}"
            echo ""
            echo "All builds passed."
          } > "${RUNNER_TEMP}/commit-msg.txt"

          git add flake.lock
          git commit -F "${RUNNER_TEMP}/commit-msg.txt"

          git push origin HEAD:main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_CHANGES: ${{ needs.check.outputs.version_changes }}
          BUILD_RESULTS: ${{ steps.results.outputs.build_results }}

      - name: Trigger Build and Deploy
        if: needs.build.result == 'success'
        run: |
          # Pushes made with the default GITHUB_TOKEN don't trigger other
          # workflows' `push` events (GitHub's anti-recursion protection),
          # so the flake.lock push above won't kick off "Build and Deploy
          # LXC Containers" on its own. workflow_dispatch is exempt from
          # that restriction, so trigger it explicitly.
          gh workflow run "Build and Deploy LXC Containers" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build failed - notify
        if: needs.build.result != 'success'
        run: |
          echo "Build failed! flake.lock was never committed."

          # Same reasoning as the commit step: pass the text through `env:` and
          # a file, never inline `${{ }}` into a quoted shell argument.
          {
            echo "## Build Failure"
            echo ""
            echo "The automated update check found new versions but builds failed."
            echo ""
            echo "## Build Results"
            echo ""
            echo "${BUILD_RESULTS}"
            echo ""
            echo "## Versions Attempted"
            echo ""
            echo "${VERSION_CHANGES}"
            echo ""
            echo "Please investigate and fix manually."
          } > "${RUNNER_TEMP}/issue-body.md"

          gh issue create \
            --title "Container build failed after flake update" \
            --body-file "${RUNNER_TEMP}/issue-body.md" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_CHANGES: ${{ needs.check.outputs.version_changes }}
          BUILD_RESULTS: ${{ steps.results.outputs.build_results }}
